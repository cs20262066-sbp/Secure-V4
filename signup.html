<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — CyberSecure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1412; --panel: #151D1A; --border: #263831;
    --text: #DCE6E1; --text-dim: #8AA098; --safe: #3ED598; --danger: #E5544D;
    --accent: #4FD1C5; --mono: 'IBM Plex Mono', monospace; --display: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--display);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:34px;
    width:100%; max-width:400px;}
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .brand-mark{ width:38px; height:38px; border:1.5px solid var(--accent); border-radius:8px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-mark span{ width:8px; height:8px; border-radius:50%; background:var(--safe); box-shadow:0 0 8px var(--safe);}
  h1{ font-size:1.2rem; font-weight:700; margin:0;}
  .brand-sub{ font-family:var(--mono); font-size:.7rem; color:var(--text-dim); letter-spacing:.08em; text-transform:uppercase;}
  label{ font-family:var(--mono); font-size:.76rem; color:var(--text-dim); display:block; margin:16px 0 6px;}
  input{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    font-family:var(--mono); font-size:.9rem; padding:11px 13px; border-radius:6px;}
  input:focus{ outline:none; border-color:var(--accent);}
  .hint{ font-family:var(--mono); font-size:.72rem; color:var(--text-dim); margin-top:5px;}
  .btn{ width:100%; font-family:var(--mono); font-size:.85rem; letter-spacing:.03em; background:var(--accent);
    color:#0A1614; border:none; font-weight:600; padding:12px; border-radius:6px; cursor:pointer; margin-top:22px;}
  .btn:hover{ filter:brightness(1.12); }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .alert{ padding:11px 13px; border-radius:6px; font-size:.83rem; margin-top:16px; font-family:var(--mono);}
  .alert.error{ background:rgba(229,84,77,.15); border:1px solid var(--danger); color:var(--danger);}
  .foot{ margin-top:22px; text-align:center; font-family:var(--mono); font-size:.8rem; color:var(--text-dim);}
  .foot a{ color:var(--accent); text-decoration:none;}
  .foot a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark"><span></span></div>
      <div>
        <h1>CyberSecure</h1>
        <div class="brand-sub">Threat Desk · Create account</div>
      </div>
    </div>
    <form id="signupForm">
      <label for="company">Company name</label>
      <input type="text" id="company" autocomplete="organization">
      <label for="email">Work email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="new-password" minlength="8">
      <div class="hint">At least 8 characters</div>
      <button class="btn" id="submitBtn" type="submit">Create account</button>
      <div id="alertBox"></div>
    </form>
    <div class="foot">Already have an account? <a href="/login">Log in</a></div>
  </div>
<script>
document.getElementById("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const alertBox = document.getElementById("alertBox");
  alertBox.innerHTML = "";
  btn.disabled = true; btn.textContent = "Creating account…";
  try {
    const res = await fetch("/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        company_name: document.getElementById("company").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      alertBox.innerHTML = `<div class="alert error">${data.error || "Sign up failed"}</div>`;
      btn.disabled = false; btn.textContent = "Create account";
      return;
    }
    window.location.href = "/";
  } catch (err) {
    alertBox.innerHTML = `<div class="alert error">Network error — please try again.</div>`;
    btn.disabled = false; btn.textContent = "Create account";
  }
});
</script>
</body>
</html>
